# Test for QGIS 3.44.15 (Long Term Release - stable)

name: QGIS (3.44.15)

on:
  push:
    branches: [main, staging]
    paths:
      - "qscat/**"
      - "tests/**"
      - ".github/workflows/ci-3.44.15.yml"
  pull_request:
    branches: [main, staging]
    paths:
      - "qscat/**"
      - "tests/**"
      - ".github/workflows/ci-3.44.15.yml"

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QGIS environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: qgis
          create-args: >-
            python=3.12
            qgis=3.44.15
            pytest-cov
          # LTR builds of QGIS 3.44 are published under the qgis_ltr label
          condarc: |
            channels:
              - conda-forge/label/qgis_ltr
              - conda-forge
          cache-environment: true

      - name: PyTest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --cov=qscat/ --cov-report xml tests/

      - name: Upload Coverage Reports to CodeCov
        uses: codecov/codecov-action@v7
        with:
          flags: qgis-3.44.15-tests
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
