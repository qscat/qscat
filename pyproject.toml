[project]
name = "qscat"
version = "0.5.0"
description = "QGIS Shoreline Change Analysis Tool"
requires-python = ">=3.9"

[dependency-groups]
dev = [
  "ruff==0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py39"
extend-exclude = ["docs/build"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
]
ignore = [
  "E501",  # line length is handled by the formatter
]
